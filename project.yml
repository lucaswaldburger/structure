name: Structure
options:
  bundleIdPrefix: edu.berkeley
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
targetTemplates:
  SaverVariant:
    type: bundle
    platform: macOS
    sources:
      - path: Sources
      - path: Variants/${variant}/PrincipalView.swift
    resources:
      - path: Resources/pdb_entry_type.txt
      - path: Resources/PDB
        type: folder
    settings:
      base:
        WRAPPER_EXTENSION: saver
        MACH_O_TYPE: mh_bundle
        PRODUCT_NAME: Structure
        INFOPLIST_FILE: Variants/${variant}/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: edu.berkeley.structure.${bundleSuffix}
        # Keep each "Structure.saver" in its own dir so the four don't collide.
        CONFIGURATION_BUILD_DIR: "$(BUILD_DIR)/$(CONFIGURATION)/${variant}"
        LD_RUNPATH_SEARCH_PATHS: "@loader_path/../Frameworks @executable_path/../Frameworks"
        SKIP_INSTALL: YES
    dependencies:
      - sdk: ScreenSaver.framework
      - sdk: SceneKit.framework
      - sdk: AppKit.framework
targets:
  StructureBackbone:
    templates: [SaverVariant]
    templateAttributes:
      variant: Backbone
      bundleSuffix: backbone
  StructureBallStick:
    templates: [SaverVariant]
    templateAttributes:
      variant: BallStick
      bundleSuffix: ballstick
  StructureSpacefill:
    templates: [SaverVariant]
    templateAttributes:
      variant: Spacefill
      bundleSuffix: spacefill
  StructureRibbon:
    templates: [SaverVariant]
    templateAttributes:
      variant: Ribbon
      bundleSuffix: ribbon
  StructureCartoon:
    templates: [SaverVariant]
    templateAttributes:
      variant: Cartoon
      bundleSuffix: cartoon
  StructureSettings:
    type: application
    platform: macOS
    sources:
      - path: SettingsApp
    info:
      path: SettingsApp/Info.plist
    settings:
      base:
        PRODUCT_NAME: "Structure Settings"
        PRODUCT_BUNDLE_IDENTIFIER: edu.berkeley.structure.settings
        SKIP_INSTALL: YES
    dependencies:
      - sdk: ScreenSaver.framework
      - sdk: AppKit.framework
